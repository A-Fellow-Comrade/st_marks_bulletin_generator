name: Cross-Platform .NET Desktop Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

#kill in progress builds if newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        # Define the OS runners and their corresponding .NET Runtime Identifiers (RID)
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: Windows-Build
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: Linux-Build
          - os: macos-latest
            rid: osx-x64
            artifact_name: macOS-Build

    runs-on: ${{ matrix.os }}

    env:
      # Replace with the path to your main project file
      Project_Path: ./st_marks_bulletin_generator/st_marks_bulletin_generator.csproj
      Configuration: Release

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x # Change this if you are using .NET 6 or 7

    - name: Restore Dependencies
      run: dotnet restore ${{ env.Project_Path }} -r ${{ matrix.rid }}

    # (Optional) Run tests if you have a test project
    # - name: Run Tests
    #   run: dotnet test ./YourTestProject/YourTestProject.csproj --configuration ${{ env.Configuration }}

    - name: Publish Application
      # Publishes a self-contained, single-file executable for the target OS
      run: >
        dotnet publish ${{ env.Project_Path }}
        -c ${{ env.Configuration }}
        -r ${{ matrix.rid }}
        --self-contained true
        -p:PublishSingleFile=true
        -o ./publish_output

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ./publish_output/
